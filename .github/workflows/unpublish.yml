name: Unpublish version from Comfy Registry (Temporary)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to unpublish/delete (do NOT include v prefix)'
        required: true
        default: '12.23.0'

jobs:
  unpublish:
    name: Unpublish version
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Extract info from pyproject.toml
        id: get_info
        run: |
          PUBLISHER_ID=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['tool']['comfy']['PublisherId'])")
          NODE_NAME=$(basename -s .git `git config --get remote.origin.url`)
          echo "publisher_id=$PUBLISHER_ID" >> $GITHUB_OUTPUT
          echo "node_name=$NODE_NAME" >> $GITHUB_OUTPUT

      - name: Delete version via Comfy Registry API
        run: |
          curl --request DELETE \
            --url "https://api.comfy.org/publishers/${{ steps.get_info.outputs.publisher_id }}/nodes/${{ steps.get_info.outputs.node_name }}/versions/${{ inputs.version }}" \
            --header "Authorization: Bearer ${{ secrets.REGISTRY_ACCESS_TOKEN }}" \
            --verbose

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
