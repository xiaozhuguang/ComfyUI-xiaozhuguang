[project]

name = "ComfyUI-xiaozhuguang"

description = "小珠光 - ComfyUI节点美化增强插件，提供节点收藏、工作流管理、主题美化、田字格对齐、视觉编组等功能"

version = "25.0.0"

license = { file = "LICENSE" }

dependencies = [

    "torch",

    "torchvision",

    "numpy",

    "Pillow",

    "opencv-python",

    "transformers>=4.57.1",

    "imageio-ffmpeg",

    "safetensors",

    "librosa",

    # Qwen 3.8 GGUF（尤其视觉模型）需要 JamePeng 分支提供的 Qwen35ChatHandler。
    # ComfyUI-aki-XZG 的 Windows / Python 3.12 / CUDA 13 环境使用此已验证 GPU 轮子。
    "llama-cpp-python @ https://github.com/JamePeng/llama-cpp-python/releases/download/v0.3.46-cu130-win-20260808/llama_cpp_python-0.3.46+cu130-cp312-cp312-win_amd64.whl ; platform_system == 'Windows' and python_version == '3.12'",

    "pycryptodome",

    # 内置 VNCCS Pose Studio / SAM 3D Body，与子模块依赖清单保持一致。
    "aiohttp",
    "av",
    "kornia",
    "pytorch-lightning",
    "pyyaml",
    "einops",
    "roma",
    "tqdm",
    "huggingface_hub",
    "omegaconf",
    "yacs",
    "timm",

    # 可选（缺失会降级但不影响其它节点，详见 requirements.txt）：

    # "mediapipe",

    # "insightface",

    # "onnxruntime",

    # "flash-attn",

    # "sageattention",

]



[project.urls]

Repository = "https://github.com/xiaozhuguang/ComfyUI-xiaozhuguang"



[tool.comfy]

PublisherId = "xiaozhuguang"

DisplayName = "ComfyUI-xiaozhuguang - 小珠光插件"

web = "web"

Icon = ""
