<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>小珠光视频姿势编辑器</title><link rel="stylesheet" href="editor.css?v=28"></head><body data-pose-editor="true">
<header><div><b>小珠光视频姿势编辑器</b><span>视频骨骼 · 批量可视化编辑</span></div><div><button id="save" class="primary">保存到节点</button><button id="close">关闭</button></div></header>
<main><section class="viewer"><div class="heading"><span id="info">正在加载骨骼序列…</span><span id="frameLabel">第 1 帧</span></div><div id="stage"><video id="video" playsinline></video><img id="background" alt="原视频帧" hidden><canvas id="canvas"></canvas></div><div class="transport"><button id="prev">◀ 上一帧</button><button id="play">▶ 播放</button><button id="next">下一帧 ▶</button><div class="timeline-wrap"><input id="seek" type="range" min="0" max="0" value="0" aria-label="帧时间轴"><div class="keyframe-track" id="keyframeTrack" aria-label="关键帧时间线"></div></div></div><div class="view-settings"><button id="loadJSON">导入骨骼 JSON</button><input id="jsonFile" type="file" accept=".json" hidden><button id="demo">体验批量编辑</button></div><p id="status" role="status">执行节点后可加载整段骨骼；也可以导入 JSON 或体验。</p></section>
<aside><div class="view-settings"><label class="background-toggle"><input id="showBackground" type="checkbox" checked>原视频</label><label>线宽 <input id="lineWidth" type="range" min="1" max="6.67" step="0.01" value="4"></label><label>饱和度 <input id="saturation" type="range" min="0" max="3" step="0.01" value="1" aria-label="骨架颜色饱和度"></label><button id="loadVideo">载入本地参考视频</button><input id="videoFile" type="file" accept="video/*" hidden></div><h2>关键帧编辑</h2><label class="field">人物<select id="person"><option value="-1">所有人物</option></select></label><div id="dragModes" class="drag-modes" role="group" aria-label="拖动模式"><button type="button" data-mode="move" aria-pressed="false">拖动整体</button><button type="button" data-mode="joint" class="active" aria-pressed="true">拖动关节</button></div><hr class="editor-divider"><div class="drag-modes" role="group" aria-label="姿势编辑方式"><button id="adjustPose" class="active" aria-pressed="true">姿势调节</button><button id="manualPose" aria-pressed="false">姿势补全</button></div><div id="adjustPanel"><div id="sliders"></div></div><div id="posePicker" hidden><svg id="poseMap" viewBox="0 0 250 350" role="img" aria-label="可点击选择的 OpenPose 18 点骨架图"></svg><p id="poseSelection" class="hint">左键编号绘制，右键编号删除。</p></div><button id="undo" class="wide">撤销上一步</button><button id="reset" class="wide">清除全部调整</button></aside></main><script type="module" src="editor.js?v=45"></script></body></html>
